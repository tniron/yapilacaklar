  :root {
    color-scheme: light dark;
    --bar: #0d2b4e;          /* lacivert emaye tabela */
    --bar-line: #24466e;
    --bar-ink: #f6f7f4;
    --bar-muted: #b4c4d6;
    --ground: #f6f7f4;       /* tabela zemini */
    --plate: #ffffff;        /* sıradaki satır / alanlar */
    --ink: #1b1f24;
    --muted: #535e6a;
    --rule: #dde1e5;
    --rule-strong: #c9cfd6;
    --signal: #c8102e;       /* yalnızca sıradaki görev ve EKLE */
    --signal-text: #c8102e;  /* kırmızı yazı (SIRADAKİ, hata) */
    --signal-ink: #ffffff;
    --fresh: #e3ebf4;        /* yeni tamamlanan satır */
    --focus: #2f6fb6;
    --cond: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --pad: 20px;
    --addbar-h: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bar: #0b2340; --bar-line: #1f3d61; --bar-muted: #9fb3c9;
      --ground: #0b131d; --plate: #111d2b; --ink: #e8edf2; --muted: #9aa8b6;
      --rule: #1d2a39; --rule-strong: #2a3a4d;
      --signal: #cf2640; --signal-text: #ff6b7f; --fresh: #15304f; --focus: #7fb0e8;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    background: var(--ground); color: var(--ink);
    font: 500 17px/1.35 var(--body);
    font-variant-numeric: tabular-nums;
    caret-color: var(--ink);
    scrollbar-color: var(--rule-strong) var(--ground);
    padding-bottom: var(--addbar-h);
  }
  ::selection { background: var(--bar); color: var(--bar-ink); }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .cond { font-family: var(--cond); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; }

  /* ---------- Lacivert başlık şeridi ---------- */
  .bar { background: var(--bar); color: var(--bar-ink); padding-top: env(safe-area-inset-top); }
  .bar .wrap { padding: 28px var(--pad) 0; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 18px; }
  h1 { margin: 0; font-family: var(--cond); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: .005em; }
  .who { margin-top: 8px; font-size: 14px; color: var(--bar-muted); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .who span { overflow-wrap: anywhere; }
  .who button { background: none; border: 0; padding: 13px 6px; margin: -13px -6px; color: var(--bar-ink); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
  .left { text-align: right; line-height: 1; flex: none; }
  .left b { display: block; font-family: var(--cond); font-weight: 700; font-size: 64px; line-height: .85; letter-spacing: -.01em; }
  .left span { display: block; margin-top: 4px; font-size: 12px; color: var(--bar-muted); }

  .tabs { display: flex; border-top: 1px solid var(--bar-line); margin: 0 calc(var(--pad) * -1); padding: 0 calc(var(--pad) - 4px); }
  .tabs button {
    flex: 1; background: none; border: 0; border-bottom: 3px solid transparent;
    padding: 13px 4px 12px; color: var(--bar-muted); font-size: 15px; min-height: 48px;
  }
  .tabs button i { font-style: normal; margin-left: 6px; font-weight: 600; opacity: .85; }
  .tabs button[aria-pressed="true"] { color: var(--bar-ink); border-bottom-color: var(--bar-ink); }
  .tabs button:hover { color: var(--bar-ink); }
  .tabs button:focus-visible { outline-color: var(--bar-ink); outline-offset: -4px; }

  /* ---------- Ekleme şeridi ---------- */
  .add { background: var(--bar); border-top: 1px solid var(--bar-line); }
  .add form { display: flex; gap: 10px; padding: 14px var(--pad) 16px; }
  .field {
    flex: 1; min-width: 0; height: 50px; border-radius: 6px; border: 1px solid transparent;
    background: var(--ground); color: var(--ink); padding: 0 16px; font-size: 17px; font-weight: 500;
  }
  .field::placeholder { color: var(--muted); opacity: 1; }
  .add .field:focus-visible { outline: 2px solid var(--bar-ink); outline-offset: 2px; }
  .go {
    flex: none; min-width: 96px; height: 50px; border: 0; border-radius: 6px;
    background: var(--signal); color: var(--signal-ink); font-size: 17px; padding: 0 18px;
  }
  .go:hover { filter: brightness(1.08); }
  .go:active { transform: translateY(1px); }
  .add .msg { margin: -6px var(--pad) 12px; color: #ffd2d8; }
  @media (max-width: 719px) {
    .add { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding-bottom: env(safe-area-inset-bottom); }
    :root { --addbar-h: 82px; } /* JS ölçer; bu yalnızca ilk değer */
  }

  /* ---------- Tabela ---------- */
  .board { padding-bottom: 28px; }
  .cols, .row { display: grid; grid-template-columns: 44px 30px minmax(0, 1fr) 78px 40px; align-items: center; column-gap: 6px; padding: 0 calc(var(--pad) - 8px) 0 var(--pad); }
  .cols { padding-top: 16px; padding-bottom: 8px; font-size: 12px; letter-spacing: .12em; color: var(--muted); border-bottom: 1px solid var(--rule-strong); }
  .cols span:nth-child(4) { text-align: right; }
  ol { list-style: none; margin: 0; padding: 0; }
  .row { min-height: 58px; border-bottom: 1px solid var(--rule); }
  .tick { position: relative; width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; }
  .tick input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .tick svg { width: 22px; height: 22px; border: 1.5px solid var(--rule-strong); border-radius: 4px; background: var(--plate); color: transparent; transition: background .15s, border-color .15s; }
  .tick input:hover + svg { border-color: var(--ink); }
  .tick input:focus-visible + svg { outline: 2px solid var(--focus); outline-offset: 2px; }
  .tick input:checked + svg { background: var(--bar); border-color: var(--bar); color: var(--bar-ink); }
  @media (prefers-color-scheme: dark) { .tick input:checked + svg { background: var(--bar-ink); border-color: var(--bar-ink); color: var(--bar); } }
  .no { font-family: var(--cond); font-weight: 600; font-size: 20px; color: var(--bar); }
  @media (prefers-color-scheme: dark) { .no { color: var(--bar-muted); } }
  .text { padding: 14px 6px 14px 0; overflow-wrap: anywhere; cursor: text; touch-action: manipulation; border-radius: 4px; }
  .state { text-align: right; font-size: 13px; color: var(--muted); }
  .del { width: 40px; height: 44px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); border-radius: 6px; }
  .del svg { width: 18px; height: 18px; }
  .del:hover { color: var(--ink); }
  @media (hover: hover) { .row .del { opacity: 0; } .row:hover .del, .row .del:focus-visible { opacity: 1; } }
  .edit { width: 100%; height: 40px; padding: 0 10px; border: 1px solid var(--focus); border-radius: 6px; background: var(--plate); color: var(--ink); font-size: 17px; font-weight: 500; outline: none; }

  .row.next { background: var(--plate); }
  .row.next .no, .row.next .state { color: var(--signal-text); }
  .row.done .text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule-strong); text-decoration-thickness: 1.5px; }
  .row.done .no { color: var(--muted); }
  .row.done .state { color: var(--bar); }
  @media (prefers-color-scheme: dark) { .row.done .state { color: var(--bar-muted); } }
  .row.fresh { animation: arrive 2.6s cubic-bezier(.16, 1, .3, 1); }
  @keyframes arrive {
    0%, 60% { background: var(--fresh); }
    100% { background: transparent; }
  }
  .row.departing .state { color: var(--bar); }
  @media (prefers-color-scheme: dark) { .row.departing .state { color: var(--bar-muted); } }
  .row.departing .text { color: var(--muted); }

  .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 22px var(--pad) 8px; font-size: 12px; letter-spacing: .12em; color: var(--muted); border-bottom: 1px solid var(--rule-strong); }
  .sec .clear { background: none; border: 0; padding: 16px 10px; margin: -16px -10px; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .sec .clear:hover { color: var(--ink); }

  .empty { padding: 40px var(--pad); color: var(--muted); }
  .empty b { display: block; font-family: var(--cond); font-weight: 700; font-size: 22px; letter-spacing: .04em; color: var(--ink); margin-bottom: 6px; text-transform: uppercase; }
  .hint { padding: 20px var(--pad) 0; font-size: 14px; color: var(--muted); }
  .msg { font-size: 15px; min-height: 0; }
  .msg:empty { display: none; }
  .msg.err { color: var(--signal-text); }
  .msg.ok { color: var(--ink); }
  .loading { padding: 40px var(--pad); color: var(--muted); }

  /* ---------- Giriş / onay kodu ---------- */
  .auth { padding: 28px var(--pad) 40px; max-width: 460px; }
  .auth h2 { margin: 0 0 6px; font-family: var(--cond); font-weight: 700; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; }
  .auth .sub { margin: 0 0 20px; color: var(--muted); font-size: 16px; line-height: 1.45; }
  .auth label { display: block; margin: 14px 0 6px; font-size: 12px; letter-spacing: .12em; color: var(--muted); }
  .auth .field { width: 100%; border-color: var(--rule-strong); background: var(--plate); }
  .auth .field:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
  #codeInput { font-family: var(--cond); font-weight: 700; font-size: 30px; letter-spacing: .3em; text-align: center; height: 62px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .btn { height: 50px; border-radius: 6px; padding: 0 20px; font-size: 16px; border: 1.5px solid var(--bar); }
  .btn.primary { background: var(--bar); color: var(--bar-ink); }
  .btn.secondary { background: transparent; color: var(--bar); }
  @media (prefers-color-scheme: dark) { .btn { border-color: var(--bar-muted); } .btn.primary { background: var(--bar-ink); color: var(--bar); border-color: var(--bar-ink); } .btn.secondary { color: var(--ink); } }
  .btn:disabled, .go:disabled { opacity: .55; cursor: default; }
  .auth .msg { margin-top: 16px; }
  .link { background: none; border: 0; padding: 10px 0; margin-top: 18px; font-size: 15px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .link:hover { color: var(--ink); }

  @media (min-width: 720px) {
    :root { --pad: 28px; }
    .bar .wrap { padding-top: 40px; }
    h1 { font-size: 40px; }
    .left b { font-size: 92px; }
    .board { padding-bottom: 64px; }
  }
  @media (prefers-reduced-motion: reduce) { .row.fresh { animation: none; background: var(--fresh); } * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Yapılacaklar</h1>
        <div class="who" id="who" hidden><span id="email"></span><button id="logout" type="button">Çıkış yap</button></div>
      </div>
      <div class="left" id="leftBox" hidden aria-live="polite"><b id="leftNum">0</b><span class="cond">İş kaldı</span></div>
    </div>
    <nav class="tabs" id="tabs" hidden aria-label="Görev filtresi">
      <button type="button" class="cond" data-f="all" aria-pressed="true">Tümü<i id="nAll">0</i></button>
      <button type="button" class="cond" data-f="active" aria-pressed="false">Aktif<i id="nActive">0</i></button>
      <button type="button" class="cond" data-f="done" aria-pressed="false">Biten<i id="nDone">0</i></button>
    </nav>
  </div>
</header>

<!-- Giriş ekranı -->
<main id="authView" class="wrap" hidden>
  <form class="auth" id="authForm" novalidate>
    <h2>Giriş yap</h2>
    <p class="sub">Listeniz her cihazda aynı. Yeniyseniz e-posta ve şifre yazıp hesap oluşturun.</p>
    <label class="cond" for="authEmail">E-posta</label>
    <input class="field" type="text" id="authEmail" placeholder="ornek@eposta.com" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
    <label class="cond" for="authPass">Şifre</label>
    <input class="field" type="password" id="authPass" placeholder="En az 6 karakter" autocomplete="current-password" minlength="6" required>
    <div class="actions">
      <button class="btn primary cond" type="submit" id="loginBtn">Giriş yap</button>
      <button class="btn secondary cond" type="button" id="signupBtn">Hesap oluştur</button>
    </div>
    <div class="msg" id="authMsg" role="alert"></div>
  </form>

  <!-- Onay kodu ekranı -->
  <form class="auth" id="codeForm" hidden novalidate>
    <h2>E-postanızı onaylayın</h2>
    <p class="sub" id="codeInfo"></p>
    <label class="cond" for="codeInput">Onay kodu</label>
    <input class="field" type="text" id="codeInput" placeholder="––––––" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required>
    <div class="actions">
      <button class="btn primary cond" type="submit" id="verifyBtn">Onayla</button>
      <button class="btn secondary cond" type="button" id="resendBtn">Kodu tekrar gönder</button>
    </div>
    <div class="msg" id="codeMsg" role="alert"></div>
    <button type="button" class="link" id="backBtn">Geri dön</button>
  </form>
</main>

<!-- Görev ekranı -->
<div id="appView" hidden>
  <div class="add">
    <form class="wrap" id="form">
      <label for="input" class="sr-only">Yeni görev</label>
      <input class="field" type="text" id="input" placeholder="Yeni görev yaz…" autocomplete="off" enterkeyhint="done" maxlength="1000">
      <button class="go cond" type="submit">Ekle</button>
    </form>
    <div class="wrap"><div class="msg err" id="appMsg" role="alert"></div></div>
  </div>
  <main class="wrap board" id="board">
    <div class="cols cond" id="cols" aria-hidden="true"><span></span><span>No</span><span>Görev</span><span>Durum</span><span></span></div>
    <ol id="list"></ol>
    <div id="doneBlock" hidden>
      <div class="sec cond"><span>Tamamlananlar <span id="doneCount">0</span></span><button type="button" class="clear cond" id="clear">Temizle</button></div>
      <ol id="doneList"></ol>
    </div>
    <div id="empty" class="empty" hidden></div>
    <p class="hint" id="hint">Düzenlemek için göreve çift tıklayın ya da seçip Enter'a basın.</p>
  </main>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<script>

  const SUPABASE_KEY = "sb_publishable_iyYGIGY_P_XkTUbPBMKu1w_en-RPfr3"; // istemci (publishable) anahtarı; güvenlik RLS ile sağlanır
  const OLD_LOCAL_KEY = "yapilacaklar-v1";

  const $ = (id) => document.getElementById(id);

  if (!window.supabase) {
    document.body.insertAdjacentHTML("beforeend",
      '<p class="msg err wrap" style="padding:20px">Supabase kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</p>');

  let todos = [];
  let filter = "all";
  let user = null;
  let loaded = false;
  const fresh = new Set();
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  if (matchMedia("(hover: none)").matches) $("hint").textContent = "Düzenlemek için göreve çift dokunun.";
  // Telefonda alttaki sabit ekleme şeridinin gerçek yüksekliği kadar boşluk bırak (hata mesajı çıkınca büyür)
  const addBar = document.querySelector(".add");
  new ResizeObserver(() => {
    const fixed = getComputedStyle(addBar).position === "fixed";
    document.documentElement.style.setProperty("--addbar-h", fixed ? addBar.offsetHeight + "px" : "0px");
  }).observe(addBar);

  const showErr = (el, err) => { el.className = "msg err"; el.textContent = err ? (err.message || String(err)) : ""; };
  const showOk = (el, text) => { el.className = "msg ok"; el.textContent = text; };

  // ---------- Giriş ----------
  const AUTH_TR = {
    "Invalid login credentials": "E-posta veya şifre hatalı.",
    "User already registered": "Bu e-posta ile zaten bir hesap var. Giriş yapmayı deneyin.",
    "Token has expired or is invalid": "Kod hatalı ya da süresi dolmuş. Tekrar deneyin veya yeni kod isteyin.",
    "Error sending confirmation email": "Onay e-postası gönderilemedi. Biraz sonra tekrar deneyin.",
    "Unable to validate email address: invalid format": "Geçerli bir e-posta adresi yazın.",
  };
  const trErr = (e) => {
    if (/email rate limit/i.test(e.message)) return { message: "Son bir saatte çok fazla e-posta gönderildi. Biraz sonra tekrar deneyin." };
    if (/security purposes|rate limit/i.test(e.message)) return { message: "Çok sık deneme yapıldı. Birkaç saniye bekleyip tekrar deneyin." };
    if (/password/i.test(e.message) && /6/.test(e.message)) return { message: "Şifre en az 6 karakter olmalı." };
    return { message: AUTH_TR[e.message] || e.message };
  };

  // Eski sürümde kullanıcı adıyla açılmış hesaplar: ali -> ali@yapilacaklar.invalid (yalnızca giriş için)
  const USER_DOMAIN = "yapilacaklar.invalid";
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function loginEmail(raw) {
    const v = raw.trim().toLowerCase();
    if (!v) throw new Error("E-posta adresinizi yazın.");
    if (v.includes("@")) return v;
    if (/^[a-z0-9._-]{3,30}$/.test(v)) return `${v}@${USER_DOMAIN}`;
    throw new Error("Geçerli bir e-posta adresi yazın.");
  }
  const displayName = (email) => email && email.endsWith("@" + USER_DOMAIN) ? email.slice(0, -USER_DOMAIN.length - 1) : email;

  // ---------- Onay kodu ----------
  let pendingEmail = null;
  function showCodeStep(email, note) {
    pendingEmail = email;
    $("authForm").hidden = true; $("codeForm").hidden = false;
    $("codeInfo").textContent = `${email} adresine 6 haneli bir kod gönderdik. Gelen kutusunda yoksa spam klasörüne bakın.`;
    $("codeInput").value = "";
    note ? showOk($("codeMsg"), note) : showErr($("codeMsg"), null);
    $("codeInput").focus();
  }
  function showLoginStep() {
    pendingEmail = null;
    $("codeForm").hidden = true; $("authForm").hidden = false;
    $("authEmail").focus();
  }
  async function sendCode(email) {
    const { error } = await db.auth.resend({ type: "signup", email });
    return error;
  }

  $("authForm").onsubmit = async (e) => {
    e.preventDefault();
    showErr($("authMsg"), null);
    let email; try { email = loginEmail($("authEmail").value); } catch (err) { return showErr($("authMsg"), err); }
    if (!$("authPass").value) return showErr($("authMsg"), { message: "Şifrenizi yazın." });
    const btn = $("loginBtn"); btn.disabled = true;
    const { error } = await db.auth.signInWithPassword({ email, password: $("authPass").value });
    if (error && error.message === "Email not confirmed") {
      // Hesap var ama onaylanmamış: yeni kod gönder ve kod ekranına geç
      const err2 = await sendCode(email);
      btn.disabled = false;
      return err2 ? showErr($("authMsg"), trErr(err2)) : showCodeStep(email, "Hesabınız henüz onaylanmamış. Yeni bir kod gönderdik.");
    }
    btn.disabled = false;
    if (error) showErr($("authMsg"), trErr(error));
  };

  $("signupBtn").onclick = async () => {
    showErr($("authMsg"), null);
    const email = $("authEmail").value.trim().toLowerCase();
    if (!EMAIL_RE.test(email)) return showErr($("authMsg"), { message: "Hesap oluşturmak için geçerli bir e-posta adresi yazın." });
    if ($("authPass").value.length < 6) return showErr($("authMsg"), { message: "Şifre en az 6 karakter olmalı." });
    const btn = $("signupBtn"); btn.disabled = true;
    const { data, error } = await db.auth.signUp({ email, password: $("authPass").value });
    btn.disabled = false;
    if (error) return showErr($("authMsg"), trErr(error));
    // Aynı e-posta zaten kayıtlı ve onaylıysa Supabase güvenlik gereği hata vermez, boş "identities" döner
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      return showErr($("authMsg"), { message: AUTH_TR["User already registered"] });
    }
    if (!data.session) showCodeStep(email);
  };

  $("codeForm").onsubmit = async (e) => {
    e.preventDefault();
    const token = $("codeInput").value.replace(/\s/g, "");
    if (!/^\d{6,10}$/.test(token)) return showErr($("codeMsg"), { message: "Kod yalnızca rakamlardan oluşur." });
    const btn = $("verifyBtn"); btn.disabled = true; showErr($("codeMsg"), null);
    const { error } = await db.auth.verifyOtp({ email: pendingEmail, token, type: "signup" });
    btn.disabled = false;
    if (error) return showErr($("codeMsg"), trErr(error));
    // Başarılı: onAuthStateChange görev ekranına geçirir
  };

  $("resendBtn").onclick = async () => {
    const btn = $("resendBtn"); btn.disabled = true;
    const error = await sendCode(pendingEmail);
    btn.disabled = false;
    error ? showErr($("codeMsg"), trErr(error)) : showOk($("codeMsg"), "Yeni kod gönderildi.");
  };

  $("backBtn").onclick = showLoginStep;

  $("logout").onclick = () => db.auth.signOut();

  function setSignedIn(isIn) {
    $("authView").hidden = isIn;
    $("appView").hidden = !isIn;
    $("who").hidden = !isIn;
    $("leftBox").hidden = !isIn;
    $("tabs").hidden = !isIn;
  }

  db.auth.onAuthStateChange((_event, session) => {
    const newUser = session ? session.user : null;
    if ((newUser && newUser.id) === (user && user.id)) return;
    user = newUser;
    setSignedIn(!!user);
    if (user) {
      $("codeForm").hidden = true; $("authForm").hidden = false; pendingEmail = null;
      $("email").textContent = displayName(user.email);
      loaded = false; render();
      setTimeout(async () => { await importOldLocal(); await load(); if (matchMedia("(min-width: 720px)").matches) $("input").focus(); }, 0);
    } else {
      todos = []; loaded = false; $("authPass").value = ""; $("authEmail").focus();
    }
  });

  // Önceki (sadece tarayıcıda saklanan) görevleri bir kez buluta taşı
  async function importOldLocal() {
    let old = [];
    try { old = JSON.parse(localStorage.getItem(OLD_LOCAL_KEY)) || []; } catch (e) { return; }
    if (!old.length) return;
    const rows = old.filter(t => t && t.text).map(t => ({
      text: String(t.text).slice(0, 1000), done: !!t.done,
      created_at: new Date(t.created || Date.now()).toISOString(),
    }));
    const { error } = await db.from("todos").insert(rows);
    if (!error) { try { localStorage.removeItem(OLD_LOCAL_KEY); } catch (e) {} }
  }

  // ---------- Görevler ----------
  // Sefer sırası: en eski bekleyen görev en üstte ("sıradaki"), yeni görev sona eklenir.
  async function load() {
    const { data, error } = await db.from("todos").select("id,text,done,created_at").order("created_at", { ascending: true });
    if (error) return showErr($("appMsg"), error);
    showErr($("appMsg"), null);
    todos = data; loaded = true; render();
  }

  async function run(query) {
    const { error } = await query;
    if (error) { showErr($("appMsg"), error); await load(); return false; }
    showErr($("appMsg"), null);
    return true;
  }

  const pad = (n) => String(n).padStart(2, "0");
  const icon = (id) => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;

  function rowFor(t, no, isNext) {
    const li = document.createElement("li");
    li.className = "row" + (t.done ? " done" : "") + (isNext ? " next" : "") + (fresh.has(t.id) ? " fresh" : "");
    li.dataset.id = t.id;

    const tick = document.createElement("label");
    tick.className = "tick";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done;
    cb.setAttribute("aria-label", (t.done ? "Tamamlanmadı olarak işaretle: " : "Tamamlandı olarak işaretle: ") + t.text);
    cb.onchange = async () => {
      t.done = cb.checked;
      const saving = run(db.from("todos").update({ done: t.done }).eq("id", t.id));
      if (t.done) { fresh.add(t.id); setTimeout(() => fresh.delete(t.id), 2700); }
      if (t.done && !reduceMotion.matches) {
        // Sefer kalkıyor: durum yerinde TAMAM olur, sonra satır Tamamlananlar'daki yerine kayar
        st.textContent = "Tamam"; li.classList.add("departing");
        await new Promise(r => setTimeout(r, 350));
        const before = li.getBoundingClientRect().top;
        render();
        const moved = document.querySelector(`.row[data-id="${t.id}"]`);
        if (moved) {
          const d = before - moved.getBoundingClientRect().top;
          moved.animate([{ transform: `translateY(${d}px)` }, { transform: "translateY(0)" }], { duration: 520, easing: "cubic-bezier(.16, 1, .3, 1)" });
        }
      } else {
        render();
      }
      await saving;
    };
    tick.append(cb);
    tick.insertAdjacentHTML("beforeend", icon("i-check"));

    const n = document.createElement("span");
    n.className = "no"; n.textContent = pad(no);

    const span = document.createElement("span");
    span.className = "text"; span.textContent = t.text;
    span.tabIndex = 0;
    span.title = "Düzenlemek için çift tıklayın";
    span.ondblclick = () => startEdit(li, span, t);
    span.onkeydown = (e) => { if (e.key === "Enter" || e.key === "F2") { e.preventDefault(); startEdit(li, span, t); } };
    // Telefonda çift dokunma: bazı tarayıcılar dblclick göndermediği için iki dokunuşu kendimiz yakalarız
    let lastTap = 0;
    span.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTap < 320) { e.preventDefault(); lastTap = 0; startEdit(li, span, t); }
      else lastTap = now;
    });

    const st = document.createElement("span");
    st.className = "state cond";
    st.textContent = t.done ? "Tamam" : isNext ? "Sıradaki" : "Bekliyor";

    const del = document.createElement("button");
    del.type = "button"; del.className = "del";
    del.setAttribute("aria-label", "Sil: " + t.text);
    del.innerHTML = icon("i-x");
    del.onclick = async () => {
      todos = todos.filter(x => x !== t); render();
      await run(db.from("todos").delete().eq("id", t.id));
    };

    li.append(tick, n, span, st, del);
    return li;
  }

  function render() {
    const active = todos.filter(t => !t.done);
    const done = todos.filter(t => t.done);

    $("leftNum").textContent = active.length;
    $("nAll").textContent = todos.length;
    $("nActive").textContent = active.length;
    $("nDone").textContent = done.length;
    $("doneCount").textContent = done.length;

    const list = $("list"), doneList = $("doneList"), empty = $("empty");
    list.innerHTML = ""; doneList.innerHTML = "";

    const showActive = filter !== "done";
    const showDone = filter !== "active";
    if (showActive) active.forEach((t, i) => list.appendChild(rowFor(t, i + 1, i === 0)));
    if (showDone) done.forEach((t, i) => doneList.appendChild(rowFor(t, (showActive ? active.length : 0) + i + 1, false)));
    $("doneBlock").hidden = !(showDone && done.length);

    let msg = "";
    if (!loaded) msg = "<b>Liste yükleniyor</b>Görevleriniz getiriliyor…";
    else if (!todos.length) msg = "<b>Henüz görev yok</b>İlk görevinizi " + (matchMedia("(min-width: 720px)").matches ? "yukarıdaki" : "alttaki") + " alana yazıp Ekle'ye basın.";
    else if (filter === "active" && !active.length) msg = "<b>Bekleyen iş yok</b>Tüm görevler tamamlandı.";
    else if (filter === "done" && !done.length) msg = "<b>Henüz biten yok</b>Tamamladığınız görevler burada listelenir.";
    else if (filter === "all" && !active.length) msg = "<b>Bekleyen iş yok</b>Tüm görevler tamamlandı.";
    empty.innerHTML = msg; empty.hidden = !msg;
    $("cols").hidden = !(list.children.length || doneList.children.length);
  }

  function startEdit(li, span, t) {
    if (span.parentNode !== li) return; // zaten düzenleniyor
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "edit"; inp.value = t.text; inp.maxLength = 1000;
    inp.setAttribute("aria-label", "Görevi düzenle");
    li.replaceChild(inp, span);
    inp.focus(); inp.select();
    let finished = false;
    const finish = async (commit) => {
      if (finished) return; finished = true;
      if (!commit) return render();
      const v = inp.value.trim();
      if (v === t.text) return render();
      if (v) {
        t.text = v; render();
        await run(db.from("todos").update({ text: v }).eq("id", t.id));
      } else {
        todos = todos.filter(x => x !== t); render();
        await run(db.from("todos").delete().eq("id", t.id));
      }
    };
    inp.onkeydown = (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    };
    inp.onblur = () => finish(true);
  }

  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const v = $("input").value.trim();
    if (!v) return $("input").focus();
    $("input").value = "";
    const { data, error } = await db.from("todos").insert({ text: v }).select("id,text,done,created_at").single();
    if (error) { $("input").value = v; return showErr($("appMsg"), error); }
    showErr($("appMsg"), null);
    todos.push(data); render();
  };

  document.querySelectorAll(".tabs button").forEach(b => {
    b.onclick = () => {
      filter = b.dataset.f;
      document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      render();
    };
  });

  $("clear").onclick = async () => {
    const ids = todos.filter(t => t.done).map(t => t.id);
    if (!ids.length) return;
    todos = todos.filter(t => !t.done); render();
    await run(db.from("todos").delete().in("id", ids));
  };

  // Başka cihazda yapılan değişiklikleri görmek için sekmeye dönünce yenile
  document.addEventListener("visibilitychange", () => { if (!document.hidden && user) load(); });

  // İlk açılış: oturum yoksa giriş ekranını göster
  db.auth.getSession().then(({ data }) => {
    if (!data.session) { setSignedIn(false); $("authEmail").focus(); }
  });
</script>
</body>
</html>
