<!doctype html>
<html lang="tr">
<body style="margin:0;padding:24px;background:#f4f2ee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1f1f1f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e6e2dc;border-radius:12px;">
    <tr><td style="padding:32px;">
      <h1 style="margin:0 0 12px;font-size:22px;">Yapılacaklar — e-posta onayı</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.5;">Hesabınızı tamamlamak için aşağıdaki kodu kayıt ekranına yazın:</p>
      <p style="margin:0 0 20px;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;background:#f6e3da;color:#d97757;border-radius:10px;padding:16px 0;">{{ .Token }}</p>
      <p style="margin:0;font-size:13px;color:#8a8580;line-height:1.5;">Kod 1 saat geçerlidir. Bu kaydı siz yapmadıysanız bu e-postayı yok sayabilirsiniz.</p>
    </td></tr>
  </table>
</body>
</html>
