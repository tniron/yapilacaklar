<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapılacaklar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --text: #1f1f1f; --muted: #8a8580;
    --line: #e6e2dc; --accent: #d97757; --accent-soft: #f6e3da; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b1a; --card: #262523; --text: #ecebe8; --muted: #8f8a84;
      --line: #383633; --accent: #e08a6c; --accent-soft: #3a2b25; --danger: #e5675a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 48px 16px;
  }
  main { width: 100%; max-width: 560px; }
  [hidden] { display: none !important; }
  .top { display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .who { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
  .who button { background: transparent; color: var(--muted); padding: 0; font-size: 13px; text-decoration: underline; }
  .date { color: var(--muted); margin-bottom: 24px; }
  form.row { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text], input[type=email], input[type=password] {
    flex: 1; width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; padding: 0 18px;
  }
  button:disabled { opacity: .6; cursor: default; }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; align-items: center; }
  .filters button { background: transparent; color: var(--muted); padding: 6px 12px; font-size: 14px; }
  .filters button.active { background: var(--accent-soft); color: var(--accent); }
  .filters .count { margin-left: auto; color: var(--muted); font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card);
       border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: none; }
  li input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  li .text { flex: 1; word-break: break-word; cursor: text; }
  li.done .text { text-decoration: line-through; color: var(--muted); }
  li .del { background: transparent; color: var(--muted); padding: 4px 8px; font-size: 18px; opacity: 0; }
  li:hover .del { opacity: 1; }
  li .del:hover { color: var(--danger); }
  li .edit { flex: 1; padding: 4px 8px; font-size: 16px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .footer { display: flex; justify-content: flex-end; margin-top: 12px; }
  .footer button { background: transparent; color: var(--muted); font-size: 14px; padding: 6px 0; }
  .footer button:hover { color: var(--danger); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 24px; text-align: center; }
  .msg { font-size: 14px; margin: 8px 0 16px; min-height: 1em; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); }
  .auth { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .auth h2 { margin: 0 0 16px; font-size: 20px; }
  .auth input { margin-bottom: 10px; }
  .auth .actions { display: flex; gap: 8px; margin-top: 6px; }
  .auth .actions button { padding: 12px 18px; }
  .auth .actions .secondary { background: var(--accent-soft); color: var(--accent); }
  .auth .sub { margin: -6px 0 14px; color: var(--muted); font-size: 14px; }
  .auth #codeInput { font-size: 22px; letter-spacing: 6px; text-align: center; }
  .auth .link { background: transparent; color: var(--muted); padding: 0; font-size: 14px; }
  .auth .link:hover { color: var(--text); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Yapılacaklar</h1>
    <div class="who" id="who" hidden><span id="email"></span><br><button id="logout">Çıkış yap</button></div>
  </div>
  <div class="date" id="date"></div>

  <!-- Giriş ekranı -->
  <section id="authView" hidden>
    <form class="auth" id="authForm">
      <h2>Giriş yap</h2>
      <input type="text" id="authEmail" placeholder="E-posta" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
      <input type="password" id="authPass" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password" minlength="6" required>
      <div class="actions">
        <button type="submit" id="loginBtn">Giriş yap</button>
        <button type="button" class="secondary" id="signupBtn">Hesap oluştur</button>
      </div>
      <div class="msg" id="authMsg"></div>
    </form>

    <!-- Onay kodu ekranı -->
    <form class="auth" id="codeForm" hidden>
      <h2>E-postanızı onaylayın</h2>
      <p class="sub" id="codeInfo"></p>
      <input type="text" id="codeInput" placeholder="Onay kodu" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required>
      <div class="actions">
        <button type="submit" id="verifyBtn">Onayla</button>
        <button type="button" class="secondary" id="resendBtn">Kodu tekrar gönder</button>
      </div>
      <div class="msg" id="codeMsg"></div>
      <button type="button" class="link" id="backBtn">← Geri dön</button>
    </form>
  </section>

  <!-- Görev ekranı -->
  <section id="appView" hidden>
    <form class="row" id="form">
      <input type="text" id="input" placeholder="Yeni görev ekle…" autocomplete="off">
      <button type="submit">Ekle</button>
    </form>
    <div class="msg err" id="appMsg"></div>

    <div class="filters">
      <button data-f="all" class="active">Tümü</button>
      <button data-f="active">Aktif</button>
      <button data-f="done">Tamamlanan</button>
      <span class="count" id="count"></span>
    </div>

    <ul id="list"></ul>

    <div class="footer"><button id="clear">Tamamlananları temizle</button></div>
    <div class="hint">Düzenlemek için göreve çift tıklayın. Görevler Supabase'te saklanır.</div>
  </section>
</main>

<script>
  const SUPABASE_URL = "https://mhwmloctjeeezllwsqhp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_iyYGIGY_P_XkTUbPBMKu1w_en-RPfr3"; // istemci (publishable) anahtarı; güvenlik RLS ile sağlanır
  const OLD_LOCAL_KEY = "yapilacaklar-v1";

  const $ = (id) => document.getElementById(id);
  $("date").textContent = new Date().toLocaleDateString("tr-TR",
    { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  if (!window.supabase) {
    document.querySelector("main").insertAdjacentHTML("beforeend",
      '<p class="msg err">Supabase kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edin.</p>');
    throw new Error("supabase-js yüklenemedi");
  }
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let todos = [];
  let filter = "all";
  let user = null;

  const showErr = (el, err) => { el.className = "msg err"; el.textContent = err ? (err.message || String(err)) : ""; };
  const showOk = (el, text) => { el.className = "msg ok"; el.textContent = text; };

  // ---------- Giriş ----------
  const AUTH_TR = {
    "Invalid login credentials": "E-posta veya şifre hatalı.",
    "User already registered": "Bu e-posta ile zaten bir hesap var. Giriş yapmayı deneyin.",
    "Token has expired or is invalid": "Kod hatalı ya da süresi dolmuş. Tekrar deneyin veya yeni kod isteyin.",
    "Error sending confirmation email": "Onay e-postası gönderilemedi. Biraz sonra tekrar deneyin.",
    "Unable to validate email address: invalid format": "Geçerli bir e-posta adresi yazın.",
  };
  const trErr = (e) => {
    if (/email rate limit/i.test(e.message)) return { message: "Son bir saatte çok fazla e-posta gönderildi. Biraz sonra tekrar deneyin." };
    if (/security purposes|rate limit/i.test(e.message)) return { message: "Çok sık deneme yapıldı. Birkaç saniye bekleyip tekrar deneyin." };
    return { message: AUTH_TR[e.message] || e.message };
  };

  // Eski sürümde kullanıcı adıyla açılmış hesaplar: ali -> ali@yapilacaklar.invalid (yalnızca giriş için)
  const USER_DOMAIN = "yapilacaklar.invalid";
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function loginEmail(raw) {
    const v = raw.trim().toLowerCase();
    if (v.includes("@")) return v;
    if (/^[a-z0-9._-]{3,30}$/.test(v)) return `${v}@${USER_DOMAIN}`;
    throw new Error("Geçerli bir e-posta adresi yazın.");
  }
  const displayName = (email) => email && email.endsWith("@" + USER_DOMAIN) ? email.slice(0, -USER_DOMAIN.length - 1) : email;

  // ---------- Onay kodu ----------
  let pendingEmail = null;
  function showCodeStep(email, note) {
    pendingEmail = email;
    $("authForm").hidden = true; $("codeForm").hidden = false;
    $("codeInfo").textContent = `${email} adresine bir onay kodu gönderdik. Kodu aşağıya yazın. (Gelen kutusunda yoksa spam klasörüne bakın.)`;
    $("codeInput").value = "";
    note ? showOk($("codeMsg"), note) : showErr($("codeMsg"), null);
    $("codeInput").focus();
  }
  function showLoginStep() {
    pendingEmail = null;
    $("codeForm").hidden = true; $("authForm").hidden = false;
    $("authEmail").focus();
  }
  async function sendCode(email) {
    const { error } = await db.auth.resend({ type: "signup", email });
    return error;
  }

  $("authForm").onsubmit = async (e) => {
    e.preventDefault();
    showErr($("authMsg"), null);
    let email; try { email = loginEmail($("authEmail").value); } catch (err) { return showErr($("authMsg"), err); }
    const btn = $("loginBtn"); btn.disabled = true;
    const { error } = await db.auth.signInWithPassword({ email, password: $("authPass").value });
    if (error && error.message === "Email not confirmed") {
      // Hesap var ama onaylanmamış: yeni kod gönder ve kod ekranına geç
      const err2 = await sendCode(email);
      btn.disabled = false;
      return err2 ? showErr($("authMsg"), trErr(err2)) : showCodeStep(email, "Hesabınız henüz onaylanmamış. Yeni bir kod gönderdik.");
    }
    btn.disabled = false;
    if (error) showErr($("authMsg"), trErr(error));
  };

  $("signupBtn").onclick = async () => {
    if (!$("authForm").reportValidity()) return;
    showErr($("authMsg"), null);
    const email = $("authEmail").value.trim().toLowerCase();
    if (!EMAIL_RE.test(email)) return showErr($("authMsg"), { message: "Hesap oluşturmak için geçerli bir e-posta adresi yazın." });
    const btn = $("signupBtn"); btn.disabled = true;
    const { data, error } = await db.auth.signUp({ email, password: $("authPass").value });
    btn.disabled = false;
    if (error) return showErr($("authMsg"), trErr(error));
    // Aynı e-posta zaten kayıtlı ve onaylıysa Supabase güvenlik gereği hata vermez, boş "identities" döner
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      return showErr($("authMsg"), { message: AUTH_TR["User already registered"] });
    }
    if (!data.session) showCodeStep(email);
  };

  $("codeForm").onsubmit = async (e) => {
    e.preventDefault();
    const token = $("codeInput").value.replace(/\s/g, "");
    if (!/^\d{6,10}$/.test(token)) return showErr($("codeMsg"), { message: "Kod yalnızca rakamlardan oluşur." });
    const btn = $("verifyBtn"); btn.disabled = true; showErr($("codeMsg"), null);
    const { error } = await db.auth.verifyOtp({ email: pendingEmail, token, type: "signup" });
    btn.disabled = false;
    if (error) return showErr($("codeMsg"), trErr(error));
    // Başarılı: onAuthStateChange görev ekranına geçirir
  };

  $("resendBtn").onclick = async () => {
    const btn = $("resendBtn"); btn.disabled = true;
    const error = await sendCode(pendingEmail);
    btn.disabled = false;
    error ? showErr($("codeMsg"), trErr(error)) : showOk($("codeMsg"), "Yeni kod gönderildi.");
  };

  $("backBtn").onclick = showLoginStep;

  $("logout").onclick = () => db.auth.signOut();

  db.auth.onAuthStateChange((_event, session) => {
    const newUser = session ? session.user : null;
    if ((newUser && newUser.id) === (user && user.id)) return;
    user = newUser;
    $("authView").hidden = !!user;
    $("appView").hidden = !user;
    $("who").hidden = !user;
    if (user) {
      $("codeForm").hidden = true; $("authForm").hidden = false; pendingEmail = null;
      $("email").textContent = displayName(user.email);
      setTimeout(async () => { await importOldLocal(); await load(); $("input").focus(); }, 0);
    } else {
      todos = []; $("authPass").value = ""; $("authEmail").focus();
    }
  });

  // Önceki (sadece tarayıcıda saklanan) görevleri bir kez buluta taşı
  async function importOldLocal() {
    let old = [];
    try { old = JSON.parse(localStorage.getItem(OLD_LOCAL_KEY)) || []; } catch (e) { return; }
    if (!old.length) return;
    const rows = old.filter(t => t && t.text).map(t => ({
      text: String(t.text).slice(0, 1000), done: !!t.done,
      created_at: new Date(t.created || Date.now()).toISOString(),
    }));
    const { error } = await db.from("todos").insert(rows);
    if (!error) { try { localStorage.removeItem(OLD_LOCAL_KEY); } catch (e) {} }
  }

  // ---------- Görevler ----------
  async function load() {
    const { data, error } = await db.from("todos").select("id,text,done,created_at").order("created_at", { ascending: false });
    if (error) return showErr($("appMsg"), error);
    showErr($("appMsg"), null);
    todos = data; render();
  }

  async function run(query) {
    const { error } = await query;
    if (error) { showErr($("appMsg"), error); await load(); return false; }
    showErr($("appMsg"), null);
    return true;
  }

  function render() {
    const list = $("list");
    list.innerHTML = "";
    const shown = todos.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));

    if (!shown.length) {
      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = todos.length ? "Bu filtrede görev yok." : "Henüz görev yok. Yukarıdan ekleyin.";
      list.appendChild(div);
    }

    for (const t of shown) {
      const li = document.createElement("li");
      if (t.done) li.classList.add("done");

      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = t.done;
      cb.onchange = async () => {
        t.done = cb.checked; render();
        await run(db.from("todos").update({ done: t.done }).eq("id", t.id));
      };

      const span = document.createElement("span");
      span.className = "text"; span.textContent = t.text;
      span.ondblclick = () => startEdit(li, span, t);

      const del = document.createElement("button");
      del.className = "del"; del.title = "Sil"; del.textContent = "×";
      del.onclick = async () => {
        todos = todos.filter(x => x !== t); render();
        await run(db.from("todos").delete().eq("id", t.id));
      };

      li.append(cb, span, del);
      list.appendChild(li);
    }

    const left = todos.filter(t => !t.done).length;
    $("count").textContent = `${left} görev kaldı`;
    $("clear").style.visibility = todos.some(t => t.done) ? "visible" : "hidden";
  }

  function startEdit(li, span, t) {
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "edit"; inp.value = t.text;
    li.replaceChild(inp, span);
    inp.focus(); inp.select();
    let finished = false;
    const finish = async (commit) => {
      if (finished) return; finished = true;
      if (!commit) return render();
      const v = inp.value.trim();
      if (v === t.text) return render();
      if (v) {
        t.text = v; render();
        await run(db.from("todos").update({ text: v }).eq("id", t.id));
      } else {
        todos = todos.filter(x => x !== t); render();
        await run(db.from("todos").delete().eq("id", t.id));
      }
    };
    inp.onkeydown = (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    };
    inp.onblur = () => finish(true);
  }

  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const v = $("input").value.trim();
    if (!v) return;
    $("input").value = "";
    const { data, error } = await db.from("todos").insert({ text: v }).select("id,text,done,created_at").single();
    if (error) { $("input").value = v; return showErr($("appMsg"), error); }
    showErr($("appMsg"), null);
    todos.unshift(data); render();
  };

  document.querySelectorAll(".filters button").forEach(b => {
    b.onclick = () => {
      filter = b.dataset.f;
      document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("active", x === b));
      render();
    };
  });

  $("clear").onclick = async () => {
    const ids = todos.filter(t => t.done).map(t => t.id);
    if (!ids.length) return;
    todos = todos.filter(t => !t.done); render();
    await run(db.from("todos").delete().in("id", ids));
  };

  // Başka cihazda yapılan değişiklikleri görmek için sekmeye dönünce yenile
  document.addEventListener("visibilitychange", () => { if (!document.hidden && user) load(); });

  // İlk açılış: oturum yoksa giriş ekranını göster
  db.auth.getSession().then(({ data }) => {
    if (!data.session) { $("authView").hidden = false; $("authEmail").focus(); }
  });
</script>
</body>
</html>
